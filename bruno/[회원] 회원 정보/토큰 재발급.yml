info:
  name: 토큰 재발급
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/reissue"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
